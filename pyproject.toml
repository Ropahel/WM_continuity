[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-continuity"
version = "0.1.0"
description = "Experimental latent world models for Trackmania 2020"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyarrow>=17.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
