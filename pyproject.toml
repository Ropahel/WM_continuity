[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-continuity"
version = "0.2.0"
description = "Modular latent World Model experiments on lightweight simulations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
    "PyYAML>=6.0",
    "tensorboard>=2.17",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wm_continuity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["archive"]
