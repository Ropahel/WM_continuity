experiment_name: "cube_latent_baseline"
output_root: "./runs"
seed: 0

environment:
  config: "./configs/environment.yaml"

dataset:
  root: "./data/cube"
  split_manifest: null
  split_by: "episode"
  train_fraction: 0.8
  validation_fraction: 0.1
  test_fraction: 0.1

training:
  stage: "world_model"
  device: "cpu"
  epochs: 20
  batch_size: 32
  learning_rate: 0.001

losses:
  terms:
    latent_prediction:
      name: "mse"
      weight: 1.0
      params: {}

checkpointing:
  every_n_steps: 1000
  keep_periodic: 3
  save_on_exit: true
  manual_command: "save_model"
  model_library_root: "./runs/model_library"

latent_recording:
  enabled_by_default: false
  command: "record_latents"
  scope: "next_episode"
