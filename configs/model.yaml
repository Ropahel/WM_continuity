# Les variantes réelles seront choisies après la création des interfaces
# modèles. Les clés sélectionnent des noms dans le registre du projet.
observation:
  modalities:
    - state
  history_length: 8

encoder:
  name: "state_mlp"
  params:
    hidden_dims: [64, 64]

temporal_encoder:
  name: "mlp"
  params:
    hidden_dims: [64]

predictor:
  name: "mlp"
  params:
    hidden_dims: [64, 64]

latent:
  dimension: 32

policy:
  enabled: false
  name: null
  params: {}
